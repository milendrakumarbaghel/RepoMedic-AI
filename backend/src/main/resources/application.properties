spring.application.name=backend
server.port=${PORT:8080}
repomedic.data-dir=${REPOMEDIC_DATA_DIR:.repomedic}
repomedic.sandbox-enabled=${REPOMEDIC_SANDBOX_ENABLED:false}
repomedic.ai-api-url=${AI_API_URL:}
repomedic.ai-api-key=${AI_API_KEY:}
repomedic.ai-model=${AI_MODEL:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.tomcat.max-part-count=5
server.error.include-message=never
server.error.include-stacktrace=never
