services:
  repomedic:
    build:
      context: .
      target: runtime
    image: repomedic-ai:local
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      REPOMEDIC_DATA_DIR: .repomedic
      REPOMEDIC_SANDBOX_ENABLED: "false"
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - repomedic-data:/app/.repomedic
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped

volumes:
  repomedic-data:
